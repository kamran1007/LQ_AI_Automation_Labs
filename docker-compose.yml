version: '3.9'

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lightningqAIAutomationLabs-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lightningqAIAutomationLabs

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: lightningqAIAutomationLabs-redis

    restart: always

    ports:
      - "6379:6379"

volumes:
  postgres_data: